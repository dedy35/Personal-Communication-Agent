version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pca-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pca}
      POSTGRES_USER: ${POSTGRES_USER:-pca_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pca_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pca_user} -d ${POSTGRES_DB:-pca}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
